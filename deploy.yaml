apiVersion: apps/v1
kind: Deployment
metadata:
  name: deliveryproject
  labels:
    app: deliveryproject
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deliveryproject
  template:
    metadata:
      labels:
        app: deliveryproject
    spec:
      containers:
        - name: deliveryproject
          image: sidduthatikanti93/deliveryproject:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: deliveryproject-service
spec:
  type: ClusterIP
  selector:
    app: deliveryproject
  ports:
    - name: http
      port: 8501
      targetPort: 8501
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deliveryproject-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200-399"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deliveryproject-service
                port:
                  number: 8501

